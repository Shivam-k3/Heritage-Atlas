<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#E8EAE6"/>
  <!-- Subterranean stepwell stepped terraces -->
  <rect x="100" y="80" width="1000" height="640" fill="#F7F8F5" stroke="#B3A184" stroke-width="4"/>
  <path d="M 200 150 L 350 280 L 500 400 L 600 500 L 700 400 L 850 280 L 1000 150" fill="none" stroke="#25305E" stroke-width="6"/>
  <path d="M 250 200 L 370 310 L 500 430 L 600 520 L 700 430 L 830 310 L 950 200" fill="none" stroke="#B3A184" stroke-width="3"/>
