[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]   # assert in tests; FastAPI File()/Form(); long SQL strings

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app", "backend/worker.py", "backend/scripts"]
ignore_missing_imports = true
